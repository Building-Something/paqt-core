server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # The backend proxy accepts request bodies up to 20 MB.
    client_max_body_size 25m;

    # Never cache the HTML entry point so deploys propagate immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets are content-addressed: cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # pdf.js loads its worker as an ES module; nginx's default mime.types
    # does not map .mjs, so serve those explicitly as JavaScript.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API: proxy to the backend service (same-origin for the browser).
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Groq calls can take up to 120s upstream in the backend.
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}