<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/Logo-Variant-Transparent.png" />
    <link rel="apple-touch-icon" href="/assets/Logo-Variant-Transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paqt is an AI contract review workspace that finds the clauses that deserve your attention, shows where they live, and turns them into practical next steps."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#101312"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('paqt.theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Paqt — Know what you're signing.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
